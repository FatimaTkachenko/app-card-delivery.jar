name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Start SUT
      run: |
        java -jar ./artifacts/app-card-delivery.jar
      shell: cmd

    - name: Run tests
      run: gradlew.bat test -Dselenide.headless=true
      shell: cmd